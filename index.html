<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#22204F">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>TK_APP</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css">
<style>
/* La app ocupa toda la pantalla del celular, la tablet o el PC (en el simulador iba dentro de un marco) */
html, body { height: 100%; background: #16152C; overflow: hidden }
.cel { width: 100vw; height: 100vh; height: 100dvh; border-radius: 0 }
.vA .barra { padding-top: max(14px, env(safe-area-inset-top)) }
.app .cuerpo { padding-bottom: env(safe-area-inset-bottom) }
.campo input { width: 100%; height: 40px; border: 0; border-radius: 12px; background: var(--suave); padding: 0 12px; font: 600 13px Montserrat, sans-serif; color: var(--tinta) }
.campo input:focus { outline: 2px solid var(--azul) }
/* La ola de la cabecera de los formatos ya viene desvanecida: sin máscara se ve igual en pantalla y en el PDF */
.est-D .d-tit:before { -webkit-mask-image: none; mask-image: none }
/* El PDF se dibuja con html2canvas, que no entiende las sombras «inset»: los mismos contornos, con bordes comunes */
.est-D .d-tag { box-shadow: none; border: 1px solid #D9DAE6 }
.est-D .d-si { border: 1.2px solid #D64545 }
.est-D .d-no { box-shadow: none; border: 1.2px solid #B9B7D3 }
.est-D .d-op { box-shadow: none; border: 1.2px solid #C9C8E0 }
.est-D .d-op.on { border-color: #29265B }
.d-foto i { box-shadow: none; border: 1px solid #D9DAE6 }
.d-foto.on i { box-shadow: none; border: 3px solid #3466AE }
</style>
</head>
<body>
<div class="cel" id="cel-C"></div>
<div id="imprimir"></div>
<script src="catalogo.js"></script>
<script src="imagenes.js"></script>
<script src="formatos.js"></script>
<script src="equipo.js"></script>
<script src="app.js"></script>
</body>
</html>
