<style>
/* TK_APP · estilos. Salen del simulador validado (app/simulador_TK_APP.html, 05/11/2026). */

:root{
  --azul:#3466AE; --indigo:#2E2B7A; --noche:#29265B; --tinta:#29265B; --tinta2:#6B6893; --tinta3:#9A98BC;
  --borde:#E3E4F1; --suave:#F4F5FB; --verde:#2E8F66; --rojo:#D64545; --ambar:#E0922F; --teo:#1D71B8;
  --fondo:#EEF0F8;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Montserrat,"Segoe UI",sans-serif;color:var(--tinta);background:var(--fondo);-webkit-font-smoothing:antialiased}
button{font-family:inherit}
/* ---------- cabecera de la demo ---------- */
.cabecera{position:relative;overflow:hidden;color:#fff;background:linear-gradient(120deg,#22204F 0%,#2E2B7A 48%,#3466AE 100%);padding:26px 40px 0}
.cabecera canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cuenta{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:#F2C94C;color:#29265B;font-size:11.5px;font-weight:700;display:none;place-items:center}
.cuenta.ver{display:grid}
/* las tres propuestas */
.marco{position:relative;transform-origin:0 0;border-radius:48px;background:#16152C;padding:12px;box-shadow:0 22px 50px rgba(22,21,44,.28),inset 0 0 0 2px #2D2B4F}
.marco:before{content:"";position:absolute;left:50%;top:22px;transform:translateX(-50%);width:92px;height:24px;border-radius:14px;background:#16152C;z-index:20}
.cel{position:relative;width:390px;height:844px;border-radius:38px;overflow:hidden;background:var(--suave)}
.notas{margin-top:auto}
.notas .fila{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.notas label{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--tinta3)}
.anotar{border:0;background:none;color:var(--azul);font-size:12px;font-weight:600;cursor:pointer;padding:0}
textarea{width:100%;min-height:92px;resize:vertical;border:1.5px solid var(--borde);border-radius:14px;padding:10px 12px;font-family:inherit;font-size:13px;line-height:1.5;color:var(--tinta);background:#FBFBFE}
textarea:focus{outline:none;border-color:var(--azul);background:#fff}
/* ---------- formatos ---------- */
.miniatura{position:relative;overflow:hidden;border-radius:12px;box-shadow:0 0 0 1px var(--borde),0 10px 24px rgba(46,43,122,.08);cursor:zoom-in;background:#fff}
.miniatura .doc{position:absolute;left:0;top:0;transform-origin:0 0}
/* ---------- correcciones ---------- */
.resumen{background:#fff;border:1px solid var(--borde);border-radius:22px;padding:20px 22px}
.resumen pre{white-space:pre-wrap;font-family:inherit;font-size:13.5px;line-height:1.6;margin:0;color:var(--tinta)}
@media (max-width:1180px){.seccion,.cabecera{padding-left:16px;padding-right:16px}}
/* la app: barra de A arriba, paso a paso de C debajo */
.vF .top{padding:10px 18px 4px}
.vF .top h2{margin:0 0 4px;font-size:20px}
.vF .hola-t b{display:block;font-size:16px}.vF .hola-t small{font-size:11.5px;color:var(--tinta2)}
.vF .conx[data-go]{cursor:pointer}
.vF .volver{display:flex;align-items:center;gap:6px;border:0;background:none;color:var(--indigo);font-size:13px;font-weight:600;cursor:pointer;padding:2px 0;margin:0 0 2px}
.vF .baldosas{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 14px 12px}
.vF .bal{border-radius:22px;padding:14px;min-height:112px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;background:#fff;box-shadow:0 6px 16px rgba(46,43,122,.07)}
.vF .bal.grande{grid-column:1/3;min-height:92px;justify-content:flex-start;background:linear-gradient(135deg,var(--indigo),var(--azul));color:#fff;flex-direction:row;align-items:center;gap:12px}
.vF .bal.verde{background:linear-gradient(135deg,#25785A,var(--verde))}
.vF .bal .ic{width:40px;height:40px;border-radius:13px;background:#EEF3FB;color:var(--azul);display:grid;place-items:center}
.vF .bal.grande .ic{background:rgba(255,255,255,.18);color:#fff;flex:none}
.vF .bal b{font-size:14px;display:block}.vF .bal span{font-size:11.5px;color:var(--tinta2)}
.vF .bal.grande span{color:rgba(255,255,255,.85)}
.fila-u.ocupado b{color:var(--tinta2)}
.girando{display:inline-block;width:18px;height:18px;border-radius:50%;border:2.5px solid #D9DAEC;border-top-color:var(--verde);animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.candado{width:58px;height:58px;margin:4px auto 0;border-radius:18px;background:linear-gradient(135deg,var(--indigo),var(--azul));color:#fff;display:grid;place-items:center;box-shadow:0 10px 22px rgba(52,102,174,.3)}
.clave-cajas{display:flex;gap:9px;justify-content:center;margin:16px 0 8px}
.clave-cajas i{width:44px;height:52px;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--borde);display:grid;place-items:center;font-style:normal;font-size:18px;color:var(--indigo)}
.clave-cajas i.cursor{box-shadow:inset 0 0 0 2px var(--azul)}
.clave-cajas i.llena{box-shadow:inset 0 0 0 1.5px #C9C8E0}
.clave-cajas.sacude{animation:sacude .35s}
@keyframes sacude{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.clave-msg{min-height:34px}.clave-msg .mal{color:var(--rojo);font-weight:600}
.teclado{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 22px 0}
.teclado button{height:46px;border:0;border-radius:14px;background:#fff;box-shadow:0 3px 10px rgba(46,43,122,.07);font-size:19px;font-weight:600;color:var(--tinta);cursor:pointer;display:grid;place-items:center}
.teclado button:active{background:#EEF3FB}
.teclado button:disabled{opacity:.4;cursor:default}
/* formatos: una hoja grande */
#imprimir{display:none}
.medidor{position:absolute;left:-10000px;top:0;width:816px;visibility:hidden}
.hoja{height:1054px;display:flex;flex-direction:column;overflow:hidden}
.hoja-cuerpo{flex:1;min-height:0;overflow:hidden}
.hoja .d-pie{flex:none}
.hojas-vista{position:relative;overflow:hidden;background:#D9DBE9}
.hojas-esc{position:absolute;left:0;top:0;width:816px;transform-origin:0 0}
.hojas-esc .doc{position:relative!important;left:auto!important;top:auto!important;transform:none!important;box-shadow:0 2px 10px rgba(22,21,44,.18)}
@media print{
  @page{size:letter;margin:0}
  html,body{background:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body>*:not(#imprimir){display:none!important}
  #imprimir{display:block}
  #imprimir *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  #imprimir .hoja{break-after:page}
  #imprimir .hoja:last-child{break-after:auto}
}
/* dispositivos */
.disp{position:relative;margin:0 auto}
.cel.ancha .app .cuerpo{padding:0 max(0px,calc((100% - 640px)/2))}
.cel.ancha .vF .top{padding-left:max(18px,calc((100% - 640px)/2 + 18px));padding-right:max(18px,calc((100% - 640px)/2 + 18px))}
.cel.ancha .tostada{left:50%;right:auto;width:440px;margin-left:-220px}
/* firma a pantalla completa y ajuste */
.zona-firmar{width:100%;height:190px;border:2px dashed #C9C8E0;border-radius:20px;background:#FBFBFE;color:var(--azul);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-family:inherit}
.zona-firmar b{font-size:15px;color:var(--indigo)}.zona-firmar span{font-size:12px;color:var(--tinta2)}
.zona-firmar:hover{border-color:var(--azul);background:#F3F6FD}
.firma-total{position:absolute;inset:0;z-index:35;background:#fff;display:flex;flex-direction:column}
.ft-cab{display:flex;align-items:center;gap:8px;padding:44px 14px 10px;border-bottom:1px solid var(--borde)}
.ft-cab>div{flex:1;min-width:0}.ft-cab b{display:block;font-size:14px}.ft-cab span{font-size:11.5px;color:var(--tinta2)}
.ft-cab button{border:0;border-radius:12px;padding:8px 11px;background:var(--suave);color:var(--indigo);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.ft-lienzo{position:relative;flex:1;touch-action:none;background:#fff}
.ft-lienzo canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair;touch-action:none}
.ft-guia{position:absolute;left:8%;right:8%;bottom:24%;pointer-events:none}
.ft-guia i{display:block;border-bottom:2px dashed #C9C8E0}
.ft-guia span{display:block;margin-top:8px;font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--tinta3)}
.ft-pie{display:flex;align-items:center;gap:12px;padding:12px 14px 22px;border-top:1px solid var(--borde)}
.ft-pie .sub{flex:1}.ft-pie .btn{width:auto;min-width:130px}
.ajuste{position:relative;margin:0 -14px;overflow:hidden;background:#16152C;touch-action:none;cursor:grab;height:150px}
.ajuste svg{position:absolute;inset:0}
.ajuste path{stroke:#fff}
.marco-firma{position:absolute;border:2px solid #fff;border-radius:6px;box-shadow:0 0 0 900px rgba(22,21,44,.6);pointer-events:none}
.marco-firma i{position:absolute;left:6%;right:6%;bottom:16%;border-bottom:1.5px dashed rgba(255,255,255,.45)}
.zoom-f{display:flex;align-items:center;gap:8px;margin-top:12px}
.zoom-f input{flex:1;accent-color:var(--azul)}
.zoom-f button:not(.anotar){width:34px;height:34px;border:0;border-radius:11px;background:var(--suave);color:var(--indigo);font-size:18px;font-weight:700;cursor:pointer}
.vista-firma{margin-top:8px;padding:12px 14px 10px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 1px var(--borde)}
.vf-trazo{height:64px;display:flex;justify-content:center;border-bottom:1.5px solid #29265B}
.vf-linea{margin-top:4px;font-size:10px;color:var(--tinta2);text-align:center}

/* =================================================== LA APP (dentro del celular) */
.app{position:absolute;inset:0;display:flex;flex-direction:column;font-size:13px;color:var(--tinta)}
.app .estado{height:40px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 4px;font-size:12px;font-weight:700}
.app .cuerpo{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.app .cuerpo::-webkit-scrollbar{display:none}
.app svg.i{width:20px;height:20px;flex:none}
.tarj{background:#fff;border-radius:20px;padding:14px;box-shadow:0 4px 14px rgba(46,43,122,.06);margin:0 14px 12px}
.tarj h4{margin:0 0 2px;font-size:14px}
.eti2{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--tinta3)}
.sub{font-size:12px;color:var(--tinta2);line-height:1.45}
.btn{border:0;border-radius:16px;height:48px;padding:0 16px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn.pri{background:linear-gradient(135deg,var(--indigo),var(--azul));color:#fff;box-shadow:0 8px 18px rgba(52,102,174,.28)}
.btn.ver{background:var(--verde);color:#fff;box-shadow:0 8px 18px rgba(46,143,102,.28)}
.btn.sec{background:#fff;color:var(--indigo);box-shadow:inset 0 0 0 1.5px var(--borde)}
.btn:disabled{opacity:.42;cursor:default;box-shadow:none}
.fila-u{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--suave);cursor:pointer}
.fila-u:last-child{border-bottom:0}
.av{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;background:linear-gradient(135deg,#6E68C9,var(--azul))}
.fila-u b{display:block;font-size:13.5px}
.fila-u .sub{font-size:11.5px}
.chev{margin-left:auto;color:var(--tinta3)}
.busca{display:flex;align-items:center;gap:8px;height:44px;border-radius:14px;background:#fff;padding:0 12px;margin:0 14px 12px;box-shadow:inset 0 0 0 1.5px var(--borde);color:var(--tinta3);font-size:13px}
.busca input{border:0;outline:0;flex:1;font-family:inherit;font-size:13px;color:var(--tinta);background:none}
.doc-fila{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--suave)}
.doc-fila:last-child{border-bottom:0}
.doc-fila .ico{width:34px;height:34px;border-radius:11px;background:var(--suave);display:grid;place-items:center;color:var(--azul);flex:none}
.doc-fila b{display:block;font-size:13px}
.pdfb{margin-left:auto;border:0;border-radius:11px;padding:7px 10px;background:#EEF3FB;color:var(--azul);font-size:11.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:4px}
.tostada{position:absolute;left:14px;right:14px;bottom:18px;z-index:45;background:#22204F;color:#fff;border-radius:16px;padding:12px 14px;font-size:12.5px;line-height:1.45;display:flex;gap:10px;align-items:flex-start;box-shadow:0 14px 30px rgba(0,0,0,.3);animation:sube .25s ease}
.tostada svg{flex:none;color:#7FD3AE}
.tostada .anotar{color:#fff;text-decoration:underline;font-size:12.5px}   /* botones dentro del aviso: que se vean sobre el fondo oscuro */
@keyframes sube{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.campo{margin-bottom:10px}
.campo span{display:block;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--tinta3);margin-bottom:3px}
.campo div{height:40px;border-radius:12px;background:var(--suave);display:flex;align-items:center;padding:0 12px;font-size:13px;font-weight:600}

.legal-corto{font-size:12px;line-height:1.55;color:var(--tinta2)}
.legal-corto b{color:var(--tinta)}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;font-size:12.5px;line-height:1.45;cursor:pointer}
.check i{width:22px;height:22px;flex:none;border-radius:7px;box-shadow:inset 0 0 0 2px #C9C8E0;display:grid;place-items:center;color:#fff}
.check.on i{background:var(--verde);box-shadow:none}
.pasos{display:flex;gap:6px;justify-content:center;margin:2px 0 12px}
.pasos i{width:26px;height:5px;border-radius:3px;background:#D9DAEC}
.pasos i.on{background:var(--azul)}
.hora-grande{font-size:30px;font-weight:300;letter-spacing:-.01em}
.pill-ok{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;background:#2E8F661A;color:var(--verde);font-size:11.5px;font-weight:700}
.pill-esp{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;background:#E0922F1F;color:var(--ambar);font-size:11.5px;font-weight:700}
.mini-pdf{position:relative;overflow-x:hidden;overflow-y:auto;scrollbar-width:thin;border-radius:10px;box-shadow:0 0 0 1px var(--borde),0 10px 24px rgba(46,43,122,.12);background:#fff;margin:0 14px}
.mini-pdf .doc{position:absolute;left:0;top:0;transform-origin:0 0}
.ble{position:relative;width:150px;height:150px;margin:6px auto 4px}
.ble i{position:absolute;inset:0;border-radius:50%;border:2px solid var(--verde);opacity:0;animation:onda 2.4s ease-out infinite}
.ble i:nth-child(2){animation-delay:.8s}.ble i:nth-child(3){animation-delay:1.6s}
.ble b{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:var(--verde);display:grid;place-items:center;color:#fff;box-shadow:0 10px 24px rgba(46,143,102,.35)}
@keyframes onda{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1);opacity:0}}

/* --- A · Pestañas --- */
.vA{background:var(--suave)}
.vA .barra{background:linear-gradient(120deg,#22204F,#2E2B7A 55%,#3466AE);color:#fff;padding:0 16px 14px;border-radius:0 0 26px 26px;position:relative;overflow:hidden}
.vA .barra .estado{padding:0 10px 6px}
.vA .marca-app{display:flex;align-items:center;gap:10px;margin-top:2px}
.vA .marca-app .lg{width:34px;height:32px;border-radius:10px;background:#fff;display:grid;place-items:center}
.vA .marca-app .lg svg{width:24px}
.vA .marca-app b{font-size:17px;letter-spacing:.02em}
.vA .marca-app small{display:block;font-size:10px;opacity:.7;letter-spacing:.08em}
.vA .conx{margin-top:12px;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border-radius:14px;padding:8px 10px;font-size:12px;font-weight:600}
.vA .conx .pt{width:9px;height:9px;border-radius:50%;background:#F2C94C}
.vA .conx.si .pt{background:#5BE0A2;box-shadow:0 0 0 4px rgba(91,224,162,.2)}
.vA .conx .der{margin-left:auto;opacity:.75;font-weight:500}
.vA .seg{display:flex;background:#fff;margin:12px 14px;border-radius:16px;padding:4px;box-shadow:0 4px 14px rgba(46,43,122,.06)}
.vA .seg button{flex:1;border:0;background:none;border-radius:12px;height:36px;font-size:12.5px;font-weight:600;color:var(--tinta2);cursor:pointer;position:relative}
.vA .seg button.on{background:var(--indigo);color:#fff}
/* =================================================== LOS FORMATOS (hoja carta, 816 px) */
.doc{width:816px;background:#fff;color:#29265B;font-size:12px;line-height:1.45;padding:44px 50px 34px;font-family:Montserrat,"Segoe UI",sans-serif}
.doc *{box-sizing:border-box}
.doc p{margin:0 0 9px;text-align:justify}
.d-cab{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:14px}
.d-logo{width:174px;height:56px;border:1.5px dashed #C9C8E0;border-radius:12px;display:grid;place-items:center;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#A3A1C4}
.d-cons{text-align:right;font-size:10.7px;color:#6B6893;line-height:1.5}
.d-cons b{display:block;font-size:14px;color:#29265B;font-weight:700}
.d-tit{position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;gap:16px}
.d-eq{font-size:10px;font-weight:600;letter-spacing:.22em}
.d-tit h1{margin:3px 0 0;font-size:22px;font-weight:700;line-height:1.18}
.d-tags{display:flex;flex-direction:column;align-items:flex-end;gap:6px;position:relative;z-index:1;flex:none}
.d-tag{padding:4px 12px;border-radius:20px;font-size:10px;font-weight:600;white-space:nowrap}
.d-datos{display:grid;grid-template-columns:repeat(4,1fr);margin:14px 0 6px}
.d-datos>div{padding:9px 14px}
.d-eti{display:block;font-size:8.7px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#8E8CB4}
.d-datos b{font-size:12.6px;font-weight:600}
.d-h{display:flex;align-items:center;gap:10px;margin:20px 0 10px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#2E2B7A}
.d-n{flex:none;display:grid;place-items:center;font-size:11px;letter-spacing:0}
.d-nota{font-size:10.4px;color:#6B6893}
.d-dos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.d-caja{padding:12px 14px;break-inside:avoid}
.d-cajatit{display:flex;align-items:center;gap:8px;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:5px}
.d-punto{width:9px;height:9px;border-radius:50%}
.d-preg{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0}
.d-preg .q{font-weight:600;font-size:11.3px;line-height:1.3}
.d-preg .cual{display:block;font-size:10px;font-weight:600;color:#D64545}
.d-pill{display:inline-flex;align-items:center;padding:3px 11px;font-size:10px;font-weight:700;white-space:nowrap}
.d-si{background:#FBE7E7;color:#D64545}
.d-no{background:#F4F5FB;color:#9A98BC}
.d-ops{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.d-op{padding:4px 12px;font-size:10.4px;font-weight:600;color:#A3A1C4}
.d-fotos{display:flex;gap:10px;margin-top:8px;align-items:flex-end}
.d-foto{text-align:center;font-size:9.3px;font-weight:700;color:#A3A1C4}
.d-foto i{display:block;width:26px;height:26px;border-radius:50%;margin:0 auto 3px;border:2px solid #fff;box-shadow:0 0 0 1px #E3E4F1}
.d-foto.on{color:#2E2B7A}
.d-foto.on i{box-shadow:0 0 0 2.5px #3466AE;width:30px;height:30px}
.d-mapa{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start}
.d-lienzo{position:relative;overflow:hidden}
.d-lado{position:absolute;top:8px;font-size:8px;font-weight:700;letter-spacing:.14em;color:#8E8CB4;background:#ffffffcc;padding:1px 6px;border-radius:8px;z-index:2}
.d-spot{position:absolute;border-radius:50%}
.doc table{width:100%;border-collapse:collapse}
.doc th{text-align:left;font-size:8.7px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#8E8CB4;padding:0 10px 6px}
.doc td{padding:8px 10px;vertical-align:top;font-size:11px}
.d-nv{display:inline-flex;align-items:center;gap:6px;margin:1px 10px 1px 0;font-weight:600;white-space:nowrap}
.d-nv i{width:10px;height:10px;border-radius:50%}
.d-antes{display:block;font-size:9.3px;font-weight:600;color:#9A98BC}
.d-chip{display:inline-block;padding:3px 10px;margin:3px 5px 3px 0;font-size:10px;font-weight:600;white-space:nowrap;background:#F4F5FB}
.d-chip span{color:#8E8CB4;font-weight:500}
.d-barra{height:6px;border-radius:3px;background:#F4F5FB;margin:5px 0 7px}
.d-barra i{display:block;height:100%;border-radius:3px}
.d-legal{font-size:12.2px;line-height:1.58;margin-top:14px}
.d-legal .num{display:grid;grid-template-columns:36px 1fr;margin:0 0 6px}
.d-legal .num .n{font-weight:700;color:#3466AE}
.d-firma{display:grid;grid-template-columns:330px 1fr;gap:20px;align-items:end;margin-top:12px;padding:14px 18px}
.d-trazo{height:84px;display:flex;align-items:flex-end;border-bottom:1.5px solid #29265B}
.d-linea{font-size:9.3px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#8E8CB4;margin-top:5px}
.d-firma p{margin:0 0 4px;text-align:left}
.d-pie{margin-top:22px;padding-top:10px;display:flex;justify-content:space-between;font-size:9.3px;font-weight:500;color:#9A98BC}
.d-cuatro{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:8px}
.d-cuatro div{font-size:11px;font-weight:500}
.d-ses{margin-bottom:10px}
.d-leyenda{display:flex;gap:14px;font-size:9.7px;font-weight:600;color:#6B6893;margin-top:8px}

/* ronda 2: las listas se leen claras en todos los estilos (Christian: «los checklist se ven borrosos») */
.d-no{color:#5E5B84}
.d-op{color:#5E5B84}
.d-preg .q{color:#29265B}
.d-foto{color:#6B6893}
.d-logo.con{border:0;border-radius:0;padding:0;overflow:hidden}
.d-logo.con img{width:100%;height:100%;object-fit:cover;display:block}
.d-ses .d-obs{margin-top:9px;padding-top:8px;border-top:1px dashed #D9DAE6}
.d-ses .d-obs div{text-align:justify;font-size:11px;line-height:1.5}
.d-cuatro div{text-align:justify}
/* C · Ola TK */
.est-C .d-tit,.est-D .d-tit{border-radius:22px;padding:22px 24px;background:linear-gradient(110deg,#F2F3FB 0%,#E8EBF8 100%)}
/* ronda 2: la ola queda solo a la derecha y se desvanece antes del título, para que no se mezcle con la letra */
.est-C .d-tit:before,.est-D .d-tit:before{content:"";position:absolute;right:0;top:0;bottom:0;width:44%;background:var(--ola) right center/auto 100% no-repeat;opacity:.5;
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 55%);mask-image:linear-gradient(90deg,transparent 0%,#000 55%)}
.est-C .d-tit>div:first-child,.est-D .d-tit>div:first-child{max-width:60%}

/* D · Híbrido B + C (ronda 2): la cabecera clara de C con la ola a un lado; el cuerpo ordenado y legible de B */
.est-D .d-cab{padding-bottom:12px;border-bottom:1px solid #D9DAE6;margin-bottom:12px}
.est-D .d-eq{color:#3466AE}
.est-D .d-tit h1{font-size:23px;color:#29265B}
.est-D .d-tag{background:#fff;color:#29265B;box-shadow:inset 0 0 0 1px #D9DAE6;border-radius:8px}
.est-D .d-datos{margin-top:12px;border:1px solid #D9DAE6;border-radius:12px;overflow:hidden}
.est-D .d-datos>div{border-right:1px solid #E6E7EF}
.est-D .d-datos>div:last-child{border-right:0}
.est-D .d-h{color:#29265B;padding-bottom:6px;border-bottom:1.5px solid #29265B;letter-spacing:.1em}
.est-D .d-n{width:22px;height:22px;border-radius:6px;background:#29265B;color:#fff;font-size:11px}
.est-D .d-caja{border:1px solid #D9DAE6;border-radius:12px;background:#fff}
.est-D .d-preg{border-bottom:1px solid #EEEFF5;padding:7px 0}
.est-D .d-preg .q{font-size:11.6px}
.est-D .d-pill{border-radius:6px;min-width:42px;justify-content:center;font-size:10.4px}
.est-D .d-si{background:#D64545;color:#fff}
.est-D .d-no{background:#fff;color:#4A4870;box-shadow:inset 0 0 0 1.2px #B9B7D3}
.est-D .d-op{border-radius:8px;background:#fff;color:#4A4870;box-shadow:inset 0 0 0 1.2px #C9C8E0;font-size:10.8px}
.est-D .d-op.on{background:#29265B;color:#fff;box-shadow:none}
.est-D .d-op.on:before{content:"✓ ";font-weight:700}
.est-D .d-chip{border-radius:8px;background:#F4F5FB;color:#29265B}
.est-D .d-lienzo{border:1px solid #D9DAE6;border-radius:14px;background:radial-gradient(circle at 50% 35%,#FFFFFF,#EEF0F8)}
.est-D th{background:#F1F2F7;padding-top:7px;border-bottom:1px solid #D9DAE6;color:#4A4870}
.est-D td{border-bottom:1px solid #E6E7EF;font-size:11.4px}
.est-D .d-firma{border:1px solid #D9DAE6;border-radius:14px}
.est-D .d-ses{border:1px solid #D9DAE6;border-radius:12px;padding:12px 14px;border-left:5px solid var(--c)}
.est-D .d-pie{border-top:1px solid #D9DAE6}
.est-D .d-legal .num .n{color:#29265B}

/* ---------- modo noche: se pone solo de 6 p. m. a 6 a. m. (app.js, temaPorHora) ---------- */
:root{--carta:#fff}
html.noche{
  --fondo:#100F26; --suave:#15142E; --carta:#1F1D45; --carta2:#2A2862; --borde:#34315F;
  --tinta:#ECEBFA; --tinta2:#A9A7D2; --tinta3:#7774A6; --verde:#3FB27F; --rojo:#EF6262; --ambar:#F0A84A;
  color-scheme:dark;
}
html.noche body{background:var(--fondo)}
html.noche .vA, html.noche .cel{background:var(--suave)}
html.noche .tarj, html.noche .vF .bal:not(.grande), html.noche .vA .seg, html.noche .btn.sec, html.noche .busca, html.noche .teclado button,
html.noche .clave-cajas i{background:var(--carta)}
html.noche .tarj, html.noche .vF .bal:not(.grande), html.noche .vA .seg, html.noche .teclado button{box-shadow:0 4px 14px rgba(0,0,0,.28)}
html.noche .vF .bal .ic, html.noche .pdfb, html.noche .teclado button:active{background:var(--carta2);color:#8FB4F0}
html.noche .btn.sec, html.noche .vF .volver, html.noche .zona-firmar b, html.noche .zoom-f button:not(.anotar),
html.noche .clave-cajas i{color:#B9B6F2}
html.noche .anotar, html.noche .doc-fila .ico{color:#8FB4F0}
html.noche .vA .seg button.on{background:var(--azul)}
html.noche .zona-firmar{background:var(--carta);border-color:var(--borde)}
html.noche .zona-firmar:hover{background:var(--carta2)}
html.noche .tostada{background:#2C2A66}
html.noche textarea{background:var(--carta);color:var(--tinta)}
/* lo que es papel (los formatos y la vista del logo) sigue blanco y con su tinta de día */
html.noche .doc, html.noche .mini-pdf, html.noche .miniatura, html.noche .papel, html.noche .vista-firma, html.noche .firma-total{
  --tinta:#29265B; --tinta2:#6B6893; --tinta3:#9A98BC; --borde:#E3E4F1; --suave:#F4F5FB; --carta:#fff; --verde:#2E8F66; --rojo:#D64545;
  color:#29265B; color-scheme:light;
}

/* ---------- animación de inicio (C · firma) ---------- */
.inicio-tk{position:fixed;inset:0;z-index:100;background:linear-gradient(160deg,#22204F,#2E2B7A 55%,#3466AE);transition:opacity .45s ease}
.inicio-tk.sale{opacity:0;pointer-events:none}
.it-centro{position:absolute;left:0;right:0;top:44%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center}
.it-marca{width:min(58vw,280px);height:auto;overflow:visible}
.it-trazo{stroke-dasharray:1200;stroke-dashoffset:1200}
.inicio-tk.va .it-trazo{animation:itFirma 1.1s .3s cubic-bezier(.55,.05,.35,1) forwards}
.it-letras{clip-path:inset(100% 0 0 0)}
.inicio-tk.va .it-letras{animation:itEmerge .7s 1.3s cubic-bezier(.2,.8,.2,1) forwards}
.it-nombre{margin-top:28px;text-align:center;color:#fff;opacity:0;transform:translateY(10px)}
.inicio-tk.va .it-nombre{animation:itNombre .55s 1.9s ease-out forwards}
.it-nombre b{display:block;font-size:34px;font-weight:800;letter-spacing:.02em}
.it-nombre span{display:block;margin-top:7px;font-size:11.5px;font-weight:600;letter-spacing:.24em;opacity:.75}
@keyframes itFirma{to{stroke-dashoffset:0}}
@keyframes itEmerge{to{clip-path:inset(0 0 0 0)}}
@keyframes itNombre{to{opacity:1;transform:none}}
.inicio-tk.quieto .it-trazo,.inicio-tk.quieto .it-letras,.inicio-tk.quieto .it-nombre{animation:none;stroke-dashoffset:0;clip-path:none;opacity:1;transform:none}

/* «Buscar equipo»: el único botón de la pantalla de conexión, grande y centrado */
.btn.btn-buscar{max-width:320px;height:64px;margin:0 auto;font-size:18px;border-radius:20px;gap:10px}

/* Atajo de iPhone: ícono pequeño en la barra y panel con «Agregar atajo» y «Guardar imagen» (solo en Bluefy) */
.atajo-btn{margin-left:auto;width:34px;height:34px;border:0;border-radius:11px;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;cursor:pointer}
.atajo-fondo{position:absolute;inset:0;z-index:40;background:rgba(22,21,44,.55);display:flex;align-items:flex-start;justify-content:center;padding:84px 16px 0}
/* la guía paso a paso puede ser más alta que la pantalla: el panel se desplaza (100px = 84 de arriba + 16 de abajo) */
.atajo-panel{width:100%;max-width:360px;background:var(--carta);border-radius:20px;padding:14px;box-shadow:0 18px 40px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:10px;max-height:calc(100% - 100px);overflow-y:auto}
.ap-cab{display:flex;align-items:center;justify-content:space-between;font-size:15px}
.ap-cab button{border:0;background:var(--suave);color:var(--tinta2);width:30px;height:30px;border-radius:10px;font-size:14px;cursor:pointer}
.ap-nota{font-size:11.5px;line-height:1.45}
.ap-pasos{margin:2px 0 0;padding-left:20px;font-size:12.5px;line-height:1.45;color:var(--tinta)}
.ap-pasos li{margin:6px 0}

/* Sin zoom en el iPhone (Bluefy): dos toques rápidos en el teclado de la contraseña hacían «doble toque para acercar» y la
   pantalla se descuadraba. touch-action: manipulation deja tocar y desplazar, pero no ese zoom. Y en iPhone un campo de
   texto con letra menor de 16 px acerca la pantalla al tocarlo: allí los campos van a 16 px (respaldo de la meta del
   viewport, por si Bluefy la ignora). El pellizco lo frena app.js (bloquearZoom). */
html, body, button, a, input, [data-act], [data-go] { touch-action: manipulation; }
@supports (-webkit-touch-callout: none) {
  input, textarea, select { font-size: 16px !important; }
}

/* ---- demo ---- */

  background:var(--suave);color:var(--tinta);border-radius:26px;padding:16px 16px 14px;box-shadow:0 26px 60px rgba(22,21,44,.4);animation:dmSube .26s cubic-bezier(.2,.8,.2,1)}
@keyframes dmAparece{from{opacity:0}}

<script>
// TK_APP · los formatos PDF (estilo D · Híbrido B + C, aprobado el 05/11/2026) armados con los datos que manda el equipo.
// Los textos son los de las plantillas de la especificación (notas/formatos) y los del simulador validado.
// Cada doc*() devuelve el HTML de la hoja continua; paginar() la reparte en hojas carta iguales a las del PDF.
'use strict';

const COLOR_NIVEL = ['', '#F2C94C', '#F2994A', '#EB5757'];       // leve, moderado, severo
const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
// Ayudas que usa toda la app (este archivo se carga primero)
const dos = n => String(n).padStart(2, '0');
const fechaEquipo = d => `${dos(d.getDate())}/${dos(d.getMonth() + 1)}/${d.getFullYear()} · ${dos(d.getHours())}:${dos(d.getMinutes())}`;   // como guarda el equipo
const sinTildes = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const logoValido = s => /^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(s || '') ? s : '';     // el logo viene del equipo: solo una imagen
const nv = (c, t) => `<span class="d-nv"><i style="background:${c}"></i>${t}</span>`;

// ---- Firma: los trazos de firma.sig (de la pantalla o de la app), ajustados al recuadro de 300 × 80 ----------------------
function firmaSvg(texto, w = 300, h = 80) {
  const trazos = String(texto || '').split('\n').slice(1).map(l => l.trim().split(/\s+/).filter(Boolean).map(p => p.split(',').map(Number))).filter(t => t.length && !t.some(p => p.some(isNaN)));
  if (!trazos.length) return `<svg width="${w}" height="${h}"></svg>`;
  const svg = (vb, d) => `<svg width="${w}" height="${h}" viewBox="${vb}" fill="none" stroke="#2E2B7A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;
  // Firmada en TK_APP («firma app 300x80»): ya viene encuadrada en el ajuste y va tal cual; firmada en la pantalla: se encuadra
  if (/300x80/.test(String(texto).split('\n')[0])) return svg('0 0 300 80', trazosAPath(trazos));
  const b = cajaTrazos(trazos), m = 4, k = Math.min((w - 2 * m) / b.w, (h - 2 * m) / b.h);
  const ox = m + ((w - 2 * m) - b.w * k) / 2, oy = m + ((h - 2 * m) - b.h * k) / 2;
  return svg(`0 0 ${w} ${h}`, trazosAPath(trazos.map(t => t.map(([x, y]) => [ox + (x - b.x0) * k, oy + (y - b.y0) * k]))));
}
// La caja de unos trazos y su trazo SVG (también los usa la firma de la app)
function cajaTrazos(tr) {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const t of tr) for (const [x, y] of t) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
  return {x0, y0, w: Math.max(4, x1 - x0), h: Math.max(4, y1 - y0)};
}
const trazosAPath = tr => tr.filter(t => t.length).map(t => 'M' + (t.length === 1 ? [t[0], [t[0][0] + .3, t[0][1]]] : t).map(([x, y]) => (+x).toFixed(1) + ' ' + (+y).toFixed(1)).join('L')).join('');

function defValoracion(v) {
  const corporal = v.clase === 'corporal', seg = v.tipo === 'seguimiento';
  return CATALOGO.valoraciones.find(x => x.corporal === corporal && x.seguimiento === seg && (!corporal || x.zona === v.zona)) || CATALOGO.valoraciones[corporal ? 1 : 0];
}
function saludHtml(v) {

  const nAbs = lista.filter(q => abs.includes(q) && si(q)).length, nSi = lista.filter(si).length;

    <div class="d-caja"><div class="d-cajatit" style="color:#E0922F"><span class="d-punto" style="background:#E0922F"></span>Relativas</div><div class="d-nota">Con un Sí se trabaja con precaución.</div>${lista.filter(q => !abs.includes(q)).map(linea).join('')}</div></div>

function pielHtml(v) {

// Dónde va el brillo de cada zona sobre la figura del PDF: se ajusta con las zonas que el simulador ya tenía ubicadas
const ANCLAS = {
  'Mapa facial': {img: () => CARA, caja: [300, 400], dentro: [27, 14], puntos: {'Frente': [106.5, 99.5], 'Contorno de ojo derecho': [51.5, 197.5], 'Nariz': [106.5, 269.5], 'Mejilla derecha': [46.5, 223.5], 'Mejilla izquierda': [167.5, 223.5]}},
  'Abdomen / Flancos': {img: () => ABDOMEN, caja: [288, 330], dentro: [0, 0], puntos: {'3 · Infraumbilical derecho': [83, 232], '4 · Infraumbilical izquierdo': [205, 232], '5 · Flanco derecho': [40, 216]}},
};
function ajusteLineal(pares) {        // [[a, b]…] → b ≈ m·a + c
  const n = pares.length, sa = pares.reduce((s, p) => s + p[0], 0), sb = pares.reduce((s, p) => s + p[1], 0);
  const saa = pares.reduce((s, p) => s + p[0] * p[0], 0), sab = pares.reduce((s, p) => s + p[0] * p[1], 0);
  const m = (n * sab - sa * sb) / (n * saa - sa * sa || 1);
  return a => m * a + (sb - m * sa) / n;
}
function mapaHtml(v, anterior) {
  const def = defValoracion(v), M = CATALOGO.mapas[def.mapa], marcas = v.mapa || [];
  const nivelDe = (lista, z, h) => { const x = (lista || []).find(m => m[0] === z && m[1] === h); return x ? x[2] : 0; };
  const zonas = [...new Set(marcas.map(m => m[0]))].sort((a, b) => a - b);
  const filas = zonas.map(z => {
    const hs = marcas.filter(m => m[0] === z).map(([, h, n]) => {
      const antes = anterior ? nivelDe(anterior.mapa, z, h) : 0;
      return nv(COLOR_NIVEL[n], `${M.hallazgos[h]} · ${CATALOGO.niveles[n]}`) + (anterior && antes !== n ? `<span class="d-antes">Antes: ${antes ? CATALOGO.niveles[antes].toLowerCase() : 'sin hallazgo'}</span>` : '');
    }).join('<br>');
    return `<tr><td style="width:40%;font-weight:600">${M.zonas[z]}</td><td>${hs}</td></tr>`;
  }).join('') || `<tr><td colspan="2" class="d-nota">Sin hallazgos marcados.</td></tr>`;
  const leyenda = `<div class="d-leyenda">${nv(COLOR_NIVEL[1], 'Leve')}${nv(COLOR_NIVEL[2], 'Moderado')}${nv(COLOR_NIVEL[3], 'Severo')}</div>`;
  const tabla = `<div><table><tr><th>${M.corporal ? 'Región' : 'Zona'}</th><th>Hallazgos e intensidad</th></tr>${filas}</table>${leyenda}</div>`;
  const A = ANCLAS[M.titulo];
  if (!A) return `<div>${tabla}</div>`;                 // regiones corporales sin figura: solo la tabla
  const pares = Object.entries(A.puntos).map(([nom, p]) => [M.centros[M.zonas.indexOf(nom)], p]).filter(([c]) => c);
  const fx = ajusteLineal(pares.map(([c, p]) => [c[0], p[0]])), fy = ajusteLineal(pares.map(([c, p]) => [c[1], p[1]]));
  const brillos = zonas.map(z => {
    const n = Math.max(...marcas.filter(m => m[0] === z).map(m => m[2])), d = M.corporal ? 48 : 47, c = COLOR_NIVEL[n];
    const x = fx(M.centros[z][0]) - d / 2, y = fy(M.centros[z][1]) - d / 2;
    return `<div class="d-spot" style="left:${x.toFixed(0)}px;top:${y.toFixed(0)}px;width:${d}px;height:${d}px;background:radial-gradient(circle,${c}F0 0%,${c}A0 40%,${c}00 72%)"></div>`;
  }).join('');
  const [w, h] = A.caja;
  const figura = M.corporal
    ? `<img src="${A.img()}" style="position:absolute;left:0;top:0;width:${w}px;height:${h}px" alt=""><span class="d-lado" style="left:8px">DERECHA</span><span class="d-lado" style="right:8px">IZQUIERDA</span>${brillos}`
    : `<span class="d-lado" style="left:12px">DERECHA</span><span class="d-lado" style="right:12px">IZQUIERDA</span><div style="position:absolute;left:${A.dentro[0]}px;top:${A.dentro[1]}px;width:250px;height:398px"><img src="${A.img()}" style="position:absolute;left:-50px;width:350px;height:400px" alt="">${brillos}</div>`;
  return `<div class="d-mapa"><div class="d-lienzo" style="width:${w}px;height:${h}px">${figura}</div>${tabla}</div>`;
}
// d: {u, v: val_NNNN.json, n, cons, logo, anterior: la valoración anterior de la misma clase y zona (seguimiento)}

// ---- Sesiones -------------------------------------------------------------------------------------------------------------
function colorProtocolo(s) {
  const p = (s.protocolo || '').toLowerCase();
  return s.signature === 'si' ? '#0F9D8A' : p.includes('transderm') ? '#2E2B7A' : p.includes('infusion') ? '#8B5CF6' : p.includes('extract') ? '#1D71B8' : '#3466AE';
}
const mmss = s => `${String(Math.floor((+s || 0) / 60)).padStart(2, '0')}:${String((+s || 0) % 60).padStart(2, '0')}`;
const estadoPill = e => e === 'completa' ? `<span class="d-pill" style="background:#2E8F661F;color:#2E8F66">Completa</span>` : `<span class="d-pill" style="background:#E0922F1F;color:#E0922F">Interrumpida</span>`;
function tarjSesion(s, n, grande) {
  const c = colorProtocolo(s), completa = s.estado === 'completa';
  const pct = completa ? 100 : Math.max(4, Math.min(100, Math.round(100 * (+s.real_s || 0) / Math.max(1, +s.programado_s || 1))));
  const par = Object.entries(s.parametros || {}).slice(0, 8);

// Bloque por bloque; los largos (texto legal, tablas, listas de preguntas) se parten, los pequeños nunca, cada sección

<script>
// TK_APP · cómo se habla con el equipo (protocolo aprobado el 05/11/2026: notas/PROTOCOLO_BLE_TK_APP.md).
//   EquipoBle: el SKIN de verdad, por Bluetooth (Chrome, Edge o Bluefy). La app solo funciona con el equipo (sin modo de prueba
//   desde el 06/11/2026). Forma: conectar(), pedir(mensaje) → respuesta, enviar(mensaje), y avisa con alEvento y alCortar.
'use strict';

// Los dos equipos que maneja la app, por el comienzo de su nombre Bluetooth. El modelo va en la app y en los PDF.
const MODELOS = {
  'SKIN-': {nombre: 'SKIN TRANSDERM PLUS+', tecnologias: 'ultrasonido, electroporación y corriente galvánica'},
  'BIFDALL-': {nombre: 'SKIN TRANSDERM', tecnologias: 'electroporación y corriente galvánica'},
};
const PREFIJOS_EQUIPO = Object.keys(MODELOS);
const modeloDe = serie => MODELOS[PREFIJOS_EQUIPO.find(p => String(serie || '').startsWith(p))] || MODELOS['SKIN-'];
const NUS = '6e400001-b5a3-f393-e0a9-e50e24dcca9e', NUS_RX = '6e400002-b5a3-f393-e0a9-e50e24dcca9e', NUS_TX = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';
const AVISOS = ['pide_hora', 'firma_pedida', 'firma_cancelada'];

class EquipoBase {
  constructor() { this.alEvento = () => {}; this.alCortar = () => {}; this.esperando = []; this.serie = ''; this.modelo = modeloDe(''); }
  // Espera la respuesta del mismo tipo (el equipo atiende un mensaje a la vez, en orden)
  pedir(m, ms = 20000) {
    return new Promise((ok, mal) => {
      const p = {t: m.t, id: m.id, f: m.f, ok, mal, reloj: setTimeout(() => { this.esperando = this.esperando.filter(x => x !== p); mal(new Error('El equipo no respondió')); }, ms)};
      this.esperando.push(p);
      this.enviar(m).catch(e => { clearTimeout(p.reloj); this.esperando = this.esperando.filter(x => x !== p); mal(e); });
    });
  }
  recibido(m) {
    if (AVISOS.includes(m.t)) { this.alEvento(m); return; }
    // La respuesta es del pedido del mismo tipo (y del mismo usuario y archivo): una tardía no se cruza con otra
    const i = this.esperando.findIndex(p => m.t === 'error' || (p.t === m.t && (p.id === undefined || m.id === undefined || p.id === m.id) && (p.f === undefined || m.f === undefined || p.f === m.f)));
    if (i < 0) return;
    const p = this.esperando.splice(i, 1)[0];
    clearTimeout(p.reloj);
    p.ok(m);
  }
  cortado() { this.esperando.forEach(p => { clearTimeout(p.reloj); p.mal(new Error('Se cortó la conexión')); }); this.esperando = []; this.alCortar(); }
}

  static disponible() { return !!(navigator.bluetooth && navigator.bluetooth.requestDevice); }
  async conectar() {
    // La lista la dibuja el celular (Chrome o Bluefy): ahí aparece SKIN-… (SKIN TRANSDERM PLUS+) o BIFDALL-… (SKIN TRANSDERM),
    // o «… · ocupado»
    this.disp = await navigator.bluetooth.requestDevice({filters: PREFIJOS_EQUIPO.map(namePrefix => ({namePrefix})), optionalServices: [NUS]});
    const nombre = this.disp.name || '';
    if (/ocupado/i.test(nombre)) { const e = new Error('ocupado'); e.ocupado = true; throw e; }
    this.serie = nombre.trim();
    this.modelo = modeloDe(this.serie);          // SKIN TRANSDERM PLUS+ o SKIN TRANSDERM, por el nombre Bluetooth
    this.disp.addEventListener('gattserverdisconnected', () => this.cortado());

  }
  // Volver a conectar al mismo equipo sin la lista del celular (si se cayó la conexión)
  async reconectar() { await this.abrir(); }
  async abrir() {
    const gatt = await this.disp.gatt.connect();
    const serv = await gatt.getPrimaryService(NUS);
    this.rx = await serv.getCharacteristic(NUS_RX);
    const tx = await serv.getCharacteristic(NUS_TX);
    this.resto = '';

    tx.addEventListener('characteristicvaluechanged', ev => {
      this.resto += dec.decode(ev.target.value, {stream: true});

        const linea = this.resto.slice(0, i); this.resto = this.resto.slice(i + 1);
        try { this.recibido(JSON.parse(linea)); } catch (_) { /* un pedazo dañado: se ignora */ }
      }
    });

    this.cola = Promise.resolve();
  }
  // En pedazos de 180 bytes, uno tras otro (el logo ronda los 20 KB)
  enviar(m) {
    const datos = new TextEncoder().encode(JSON.stringify(m) + '\n');
    // .catch antes: si un envío falló, los siguientes igual salen (si no, la cola quedaría rechazada hasta reconectar)
    this.cola = this.cola.catch(() => {}).then(async () => {
      for (let i = 0; i < datos.length; i += 180) {
        const trozo = datos.slice(i, i + 180);
        if (this.rx.writeValueWithResponse) await this.rx.writeValueWithResponse(trozo); else await this.rx.writeValue(trozo);
      }
    });
    return this.cola;
  }
  desconectar() { try { this.disp && this.disp.gatt.disconnect(); } catch (_) { /* ya estaba */ } }
}

async function buscarEquipo() {

async function leerConsultorio() {
  if (S.consLeido) return true;
  try {
    const c = await S.eq.pedir({t: 'consultorio'});
    if (c.error) return false;
    for (const k of CAMPOS_CONS) S.cons[k] = typeof c[k] === 'string' ? c[k] : '';

// se está reconectando (no un sí/no): si entretanto se conecta otro, este bucle se retira sin tocar el del otro.
async function reconectar(eq) {
  if (S.reconectando === eq) return;
  S.reconectando = eq; S.con = false; S.lienzoTotal = false;
  tostada('Se perdió la conexión con el equipo. Reconectando…', 65000);
  for (let i = 0; i < 12 && S.eq === eq && S.reconectando === eq; i++) {
    await new Promise(r => setTimeout(r, i ? 5000 : 1500));

    try {
      await eq.reconectar();
      const r = await eq.pedir({t: 'hola', fecha: isoLocal(), pase: leer(paseKey()) || '', app: VERSION_APP}, 8000);
      // mientras se esperaba, el usuario pudo conectar otro equipo: esta conexión vieja se suelta y no se marca nada

function dejarDeReconectar(eq) { if (S.reconectando === eq) { S.reconectando = false; pintar(); } }

// cajaTrazos() y trazosAPath() están en formatos.js (las comparte con los PDF)
function encajarFirma() {
  const b = cajaTrazos(S.trazos), z = Math.min(F_W * .9 / b.w, F_H * .8 / b.h);
  S.aj = {z, z0: z, x: F_W / 2 - (b.x0 + b.w / 2) * z, y: F_H / 2 - (b.y0 + b.h / 2) * z, d: trazosAPath(S.trazos)};
}
const pathFirma = (d, g = 2.4) => `<path d="${d}" fill="none" stroke="#2E2B7A" stroke-width="${g}" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`;
const firmaAjustadaSvg = (A, w = F_W, h = F_H) => `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${F_W} ${F_H}"><g transform="translate(${A.x.toFixed(2)} ${A.y.toFixed(2)}) scale(${A.z.toFixed(4)})">${pathFirma(A.d)}</g></svg>`;
// Lo que se manda al equipo: los trazos ya ajustados, en el espacio 300 × 80 (firma.sig)
function firmaComoTexto() {
  const A = S.aj;
  return 'firma app 300x80\n' + S.trazos.map(t => t.map(([x, y]) => `${Math.round(x * A.z + A.x)},${Math.round(y * A.z + A.y)}`).join(' ')).join('\n') + '\n';
}
const MAX_PUNTOS = 2500;                   // ~11 bytes por punto: 2500 caben de sobra en los 40 000 del equipo
const firmaSuficiente = () => S.trazosTmp.reduce((n, t) => n + t.length, 0) >= 10;      // como en la pantalla: al menos 10 puntos
function capaFirma() {
  const mouse = matchMedia('(hover: hover) and (pointer: fine)').matches;
  return `<div class="firma-total">
    <div class="ft-cab"><div><b>${esc(S.nuevo.nombre)}</b><span>Firme ${mouse ? 'con el mouse' : 'con el dedo o el lápiz'} en cualquier parte de la pantalla</span></div>
      <button data-act="ftborrar">Borrar</button><button data-act="ftcancelar">Cancelar</button></div>
    <div class="ft-lienzo"><canvas data-ft></canvas><div class="ft-guia"><i></i><span>FIRMA DEL TITULAR · C.C. ${esc(conPuntos(S.nuevo.cc))}</span></div></div>
    <div class="ft-pie"><span class="sub">Después puede acercarla y moverla para que quede bien en el PDF.</span><button class="btn ver" data-act="ftlisto" ${firmaSuficiente() ? '' : 'disabled'}>${ic('check', 18, 2.6)}Listo</button></div></div>`;
}
function prepararFirmaTotal(cel) {
  const c = cel.querySelector('[data-ft]'), caja = c.parentElement;
  const w = caja.offsetWidth, h = caja.offsetHeight, k = Math.max(2, devicePixelRatio || 1);
  c.width = w * k; c.height = h * k;
  const g = c.getContext('2d'); g.scale(k, k); g.lineWidth = 3; g.lineCap = g.lineJoin = 'round'; g.strokeStyle = '#2E2B7A';
  const dibujar = t => { g.beginPath(); t.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); if (t.length === 1) g.lineTo(t[0][0] + .1, t[0][1] + .1); g.stroke(); };
  S.trazosTmp.forEach(dibujar);
  const punto = e => { const b = c.getBoundingClientRect(); return [(e.clientX - b.left) * w / b.width, (e.clientY - b.top) * h / b.height]; };
  let actual = null;
  c.addEventListener('pointerdown', e => { e.preventDefault(); try { c.setPointerCapture(e.pointerId); } catch (_) { /* igual dibuja */ } actual = [punto(e)]; S.trazosTmp.push(actual); dibujar(actual); });
  c.addEventListener('pointermove', e => {
    if (!actual) return;
    const juntos = e.getCoalescedEvents ? e.getCoalescedEvents() : [];          // los puntos intermedios, si el navegador los da
    // Solo puntos a más de 1,5 px del anterior y hasta MAX_PUNTOS en toda la firma: así el mensaje siempre cabe en el equipo
    let total = S.trazosTmp.reduce((n, t) => n + t.length, 0);
    for (const ev of (juntos.length ? juntos : [e])) {
      const p = punto(ev), u = actual[actual.length - 1];
      if (total >= MAX_PUNTOS || Math.hypot(p[0] - u[0], p[1] - u[1]) < 1.5) continue;
      actual.push(p); total++;
    }
    g.clearRect(0, 0, w, h); S.trazosTmp.forEach(dibujar);
  });
  const soltar = () => { if (!actual) return; actual = null; const b = cel.querySelector('[data-act="ftlisto"]'); if (b) b.disabled = !firmaSuficiente(); };
  c.addEventListener('pointerup', soltar); c.addEventListener('pointercancel', soltar);
}

function prepararAjuste(cel) {
  const A = S.aj, area = cel.querySelector('[data-ajuste]'), g = area.querySelector('[data-g]'), mf = area.querySelector('.marco-firma');
  const zoom = cel.querySelector('[data-zoomf]'), vista = cel.querySelector('[data-vistaf]');
  const aw = area.offsetWidth, fw = Math.min(aw - 36, 560), k = fw / F_W, fh = F_H * k, ox = (aw - fw) / 2, oy = 28;
  area.style.height = fh + 2 * oy + 'px';
  Object.assign(mf.style, {left: ox + 'px', top: oy + 'px', width: fw + 'px', height: fh + 'px'});
  const pintarA = () => {
    A.z = Math.min(A.z0 * 3, Math.max(A.z0 * .4, A.z));
    g.setAttribute('transform', `translate(${ox + A.x * k} ${oy + A.y * k}) scale(${A.z * k})`);
    zoom.value = Math.round(A.z / A.z0 * 100); vista.innerHTML = firmaAjustadaSvg(A, 240, 64);
  };
  const zoomEn = (f, px, py) => {
    const z1 = Math.min(A.z0 * 3, Math.max(A.z0 * .4, A.z * f)), fx = (px - ox) / k, fy = (py - oy) / k;
    A.x = fx - (fx - A.x) * z1 / A.z; A.y = fy - (fy - A.y) * z1 / A.z; A.z = z1; pintarA();
  };
  S._zoomEn = f => zoomEn(f, ox + fw / 2, oy + fh / 2);
  const dedos = new Map(); let dist0 = 0;
  const pos = e => { const b = area.getBoundingClientRect(); return [(e.clientX - b.left) * aw / b.width, (e.clientY - b.top) * area.offsetHeight / b.height]; };
  area.addEventListener('pointerdown', e => { e.preventDefault(); try { area.setPointerCapture(e.pointerId); } catch (_) { /* nada */ } dedos.set(e.pointerId, pos(e)); if (dedos.size === 2) { const [a, b] = [...dedos.values()]; dist0 = Math.hypot(a[0] - b[0], a[1] - b[1]); } });
  area.addEventListener('pointermove', e => {
    if (!dedos.has(e.pointerId)) return;
    const ant = dedos.get(e.pointerId), p = pos(e); dedos.set(e.pointerId, p);
    if (dedos.size === 1) { A.x += (p[0] - ant[0]) / k; A.y += (p[1] - ant[1]) / k; pintarA(); }
    else if (dedos.size === 2) { const [a, b] = [...dedos.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]); if (dist0) zoomEn(d / dist0, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2); dist0 = d; }
  });
  const fuera = e => { dedos.delete(e.pointerId); dist0 = 0; };
  area.addEventListener('pointerup', fuera); area.addEventListener('pointercancel', fuera);
  area.addEventListener('wheel', e => { e.preventDefault(); const p = pos(e); zoomEn(Math.exp(-e.deltaY * .0015), p[0], p[1]); }, {passive: false});
  zoom.addEventListener('input', () => zoomEn(zoom.value / 100 * A.z0 / A.z, ox + fw / 2, oy + fh / 2));
  pintarA();
}
async function enviarFirma() {
  if (S.enviando) return;
  S.enviando = true; pintar();
  try {
    const r = await S.eq.pedir({t: 'firma', trazos: firmaComoTexto(), acepta: 'si'}, 30000);
    S.enviando = false;
    if (!r.ok) { tostada(r.error === 'sd' ? 'El equipo no pudo guardar en la micro SD. Revísela y vuelva a enviar.' : r.error === 'no_pedida' ? 'El equipo ya no está esperando la firma.' : 'El equipo no aceptó la firma.', 6000); return; }
    S.firmado = {id: r.id, ...ahora()}; S.pend = false; S.p = 'firma';
    tostada(`El equipo confirmó: firma guardada con el registro de ${esc(S.nuevo.nombre)}.`);
  } catch (e) { S.enviando = false; tostada('No llegó la confirmación del equipo. Revise en el equipo si la firma quedó guardada.', 6500); }
}

// ---- logo: cualquier foto, se recorta la región (como en WhatsApp) --------------------------------------------------------
const LOGO_W = 500, LOGO_H = 200;          // 45 × 18 mm (5:2): el recuadro fijo de los formatos
// Las fotos del celular pueden tener 12 MP o más: el iPhone no alcanzaba a moverlas y no dejaba cambiar el logo. Se
// reducen a 1600 px por el lado largo antes de recortar (para un logo de 500 × 200 sobra) y se avisa si no abre.
const LOGO_MAX_PX = 1600;
function elegirFoto() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const url = URL.createObjectURL(f), img = new Image();
    img.onerror = () => { URL.revokeObjectURL(url); tostada('No se pudo abrir esa foto. Pruebe con otra, o con una captura de pantalla del logo.', 6500, true); };
    img.onload = () => {
      const k = Math.min(1, LOGO_MAX_PX / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      const g = c.getContext('2d');
      g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);     // JPEG no tiene transparencia: sin esto, el fondo sale negro
      g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      const src = c.toDataURL('image/jpeg', .92), chica = new Image();
      chica.onload = () => {
        const R = S.rec = {img: chica, src, w: chica.naturalWidth, h: chica.naturalHeight};
        // Empieza con la foto entera dentro del recuadro (fondo blanco alrededor); se puede alejar un poco más o acercar hasta 4 veces lo que lo llena
        const entera = Math.min(250 / R.w, 100 / R.h), llena = Math.max(250 / R.w, 100 / R.h);
        Object.assign(R, {zMin: entera * .5, zMax: llena * 4, z: entera}); R.x = (250 - R.w * R.z) / 2; R.y = (100 - R.h * R.z) / 2; S.p = 'logo'; pintar();
        if (k < 1) tostada('La foto era muy grande: se redujo sola para poder ajustarla. El logo sale igual de nítido.', 5000);
      };
      chica.src = src;
    };
    img.src = url;
  };
  inp.click();
}

  return `<div class="tarj"><span class="eti2">Arrastre la foto, acerque o aleje</span><div class="sub" style="margin:2px 0 10px">Lo que queda dentro del recuadro es el logo de todos los PDF (45 × 18 mm). Si la aleja, el resto queda en blanco.</div>

function prepararRecorte(cel) {
  const R = S.rec, area = cel.querySelector('[data-recorte]'), img = cel.querySelector('[data-foto]'), zoom = cel.querySelector('[data-zoom]'), vista = cel.querySelector('[data-vista]');
  const mx = (area.offsetWidth - 250) / 2;
  cel.querySelector('[data-marco]').style.left = cel.querySelector('[data-blanco]').style.left = mx + 'px';
  // la barra va en escala logarítmica entre lo más lejos y lo más cerca: el mismo paso se siente igual en todo el recorrido
  const aZoom = v => R.zMin * Math.pow(R.zMax / R.zMin, v / 1000), deZoom = z => Math.round(Math.log(z / R.zMin) / Math.log(R.zMax / R.zMin) * 1000);
  // si la foto es más chica que el recuadro se mueve dentro de él; si es más grande, siempre lo cubre por ese lado
  const tope = (v, tam, marco) => tam <= marco ? Math.max(0, Math.min(marco - tam, v)) : Math.min(0, Math.max(marco - tam, v));
  const g = vista.getContext('2d');
  const aplicar = () => {
    R.x = tope(R.x, R.w * R.z, 250); R.y = tope(R.y, R.h * R.z, 100);
    Object.assign(img.style, {left: mx + R.x + 'px', top: 50 + R.y + 'px', width: R.w * R.z + 'px', height: R.h * R.z + 'px'});
    g.fillStyle = '#fff'; g.fillRect(0, 0, LOGO_W, LOGO_H);
    g.drawImage(R.img, R.x * 2, R.y * 2, R.w * R.z * 2, R.h * R.z * 2);
    zoom.value = deZoom(R.z);
  };
  let ant = null;
  area.addEventListener('pointerdown', e => { ant = [e.clientX, e.clientY]; try { area.setPointerCapture(e.pointerId); } catch (_) { /* nada */ } });
  area.addEventListener('pointermove', e => { if (!ant) return; R.x += e.clientX - ant[0]; R.y += e.clientY - ant[1]; ant = [e.clientX, e.clientY]; aplicar(); });
  area.addEventListener('pointerup', () => { ant = null; });
  zoom.addEventListener('input', () => { const z = aZoom(+zoom.value), cx = (125 - R.x) / R.z, cy = (50 - R.y) / R.z; R.z = z; R.x = 125 - cx * z; R.y = 50 - cy * z; aplicar(); });
  aplicar();
  S._logoCanvas = vista;
}
async function usarLogo() {
  if (S.enviando || !S._logoCanvas) return;
  let datos, q = .85;                       // el equipo acepta hasta 30 000 letras en base64: se comprime hasta que quepa
  do { datos = S._logoCanvas.toDataURL('image/jpeg', q); q -= .1; } while (datos.length > 28000 && q > .2);
  if (datos.length > 28000) { tostada('La foto es muy pesada para el logo. Pruebe con otra.'); return; }
  S.enviando = true; pintar();
  try {
    const r = await S.eq.pedir({t: 'logo', img: datos.split(',')[1]}, 60000);
    S.enviando = false;
    if (!r.ok) { tostada('El equipo no pudo guardar el logo. Revise la micro SD.'); return; }
    S.logo = datos; S.rec = null; S.p = 'ajustes';
    tostada('Logo guardado en el equipo. Ya sale así en todos los PDF.');
  } catch (e) { S.enviando = false; tostada('No se pudo enviar el logo. Vuelva a intentar.'); }

// ---- usuarios, ficha y PDF ------------------------------------------------------------------------------------------------
let buscarReloj = null;
async function cargarUsuarios() {
  const q = S.buscar.trim();
  if (q && q.length < 3) return;
  try {
    const r = await S.eq.pedir({t: 'usuarios', q}, 20000);
    if (r.error) { S.usuarios = {error: r.error === 'ejecutando' ? 'El equipo está ejecutando un protocolo: la lista llega al terminar.' : 'La micro SD del equipo no responde.'}; }
    else S.usuarios = r;
  } catch (e) { S.usuarios = {error: 'El equipo no respondió.'}; }
  if (S.p === 'usuarios') pintar();
}
async function abrirFicha(id) {
  S.ficha = {id, cargando: true}; S.p = 'ficha'; pintar();
  try {
    const r = await S.eq.pedir({t: 'ficha', id}, 20000);
    if (r.error) { S.ficha = {id, error: r.error === 'ejecutando' ? 'El equipo está ejecutando un protocolo.' : 'No se pudo leer este usuario.'}; pintar(); return; }
    const filas = String(r.resumen || '').split('\n').filter(Boolean).map(l => l.split('\t')).filter(x => x.length >= 5);
    const de = (tipo, n) => filas.find(x => x[0] === tipo && +x[1] === n);
    const items = t => Array.from({length: t === 'v' ? r.val : r.ses}, (_, i) => { const f = de(t, i + 1); return {n: i + 1, fecha: f ? f[3] : '', titulo: f ? f[4] : ''}; }).reverse();
    S.ficha = {id, u: {id, nombre: (r.usuario && r.usuario.nombre) || '', cc: (r.usuario && r.usuario.cc) || '', alta: r.usuario && r.usuario.alta}, ci: r.ci, vals: items('v'), sess: items('s')};
  } catch (e) { S.ficha = {id, error: 'El equipo no respondió.'}; }
  if (S.p === 'ficha') pintar();
}
async function archivo(id, f) {
  const r = await S.eq.pedir({t: 'archivo', id, f}, 30000);
  if (r.error) throw new Error(r.error === 'ejecutando' ? 'El equipo está ejecutando un protocolo' : 'No se encontró ' + f);
  return r.datos;
}
const nombreArchivo = n => String(n).padStart(4, '0');
// Arma el documento pedido: {k: 'ci' | 'val' | 'ses' | 'hist', n}
async function abrirPdf(k, n, id = S.ficha && S.ficha.id) {
  S.prev = S.p; S.p = 'pdf'; S.pdf = {cargando: 'Trayendo los datos del equipo…'}; pintar();
  try {
    if (!await leerConsultorio()) throw new Error('No se pudieron leer los datos del consultorio del equipo (¿está ejecutando?). Vuelva a intentar en un momento.');
    if (!S.ficha || S.ficha.id !== id || !S.ficha.u) { await abrirFicha(id); S.p = 'pdf'; }
    const F = S.ficha, base = {u: F.u, cons: S.cons, logo: S.logo, modelo: S.modelo};
    let html, titulo, nombre;
    if (k === 'ci') {
      const firma = await archivo(id, 'firma.sig');
      html = docCI({...base, ci: F.ci || {}, firma}); titulo = 'Autorización'; nombre = `Autorizacion_${F.u.nombre}`;
    } else if (k === 'val') {
      const v = await archivo(id, `val_${nombreArchivo(n)}.json`);
      let anterior = null;
      if (v.tipo === 'seguimiento') for (let i = n - 1; i >= 1 && !anterior; i--) {
        const a = await archivo(id, `val_${nombreArchivo(i)}.json`).catch(() => null);
        if (a && a.clase === v.clase && (a.zona || '') === (v.zona || '')) anterior = a;
      }
      html = docValoracion({...base, v, n, anterior}); titulo = `Valoración n.º ${n}`; nombre = `Valoracion_${n}_${F.u.nombre}`;
    } else if (k === 'ses') {
      const s = await archivo(id, `ses_${nombreArchivo(n)}.json`);
      html = docSesion({...base, s, n}); titulo = `Sesión n.º ${n}`; nombre = `Sesion_${n}_${F.u.nombre}`;
    } else {
      const sesiones = [], vals = [], total = F.sess.length + F.vals.length;
      for (const x of F.sess) { S.pdf = {cargando: `Trayendo ${sesiones.length + vals.length + 1} de ${total}…`}; pintar(); sesiones.push({n: x.n, s: await archivo(id, `ses_${nombreArchivo(x.n)}.json`)}); }
      for (const x of F.vals) { S.pdf = {cargando: `Trayendo ${sesiones.length + vals.length + 1} de ${total}…`}; pintar(); vals.push({n: x.n, v: await archivo(id, `val_${nombreArchivo(x.n)}.json`)}); }
      html = docHistorial({...base, sesiones, vals}); titulo = 'Historial'; nombre = `Historial_${F.u.nombre}`;
    }
    await document.fonts.ready;
    mostrarPdf({hojas: paginar(html, base), titulo, nombre: sinTildes(nombre).replace(/[^\w]+/g, '_') + '.pdf', quien: F.u.nombre});
  } catch (e) {
    S.pdf = {error: e.message || 'No se pudo armar el documento.'};
    if (S.p === 'pdf') pintar();
  }
}
// Toda vista previa de un PDF pasa por aquí: se muestra y, en el mismo momento, se empieza a preparar el archivo
function mostrarPdf(datos) {
  S.pdf = datos;
  if (S.p === 'pdf') prepararPdf();    // prepararPdf ya pinta la vista con su estado
}
// ¿Sigue en pantalla esta vista previa? (si no, no se repinta ni se sigue preparando su PDF)
const pdfVigente = D => S.p === 'pdf' && S.pdf === D;
function cargarScript(src) {
  return new Promise((ok, mal) => { if (document.querySelector(`script[src="${src}"]`)) return ok(); const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => { s.remove(); mal(new Error('Sin internet para preparar el PDF')); }; document.head.appendChild(s); });
}
// El PDF de verdad: cada hoja carta se dibuja (html2canvas) y se pone en una página tamaño carta (jsPDF)
// avance(i, n) avisa la hoja que va; sigue() dice si vale la pena continuar (si no, devuelve null).
async function hacerPdf(hojas, avance, sigue) {
  await cargarScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
  await cargarScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
  const zona = document.getElementById('imprimir');
  zona.style.cssText = 'display:block;position:fixed;left:-10000px;top:0;width:816px';
  zona.innerHTML = hojas.join('');
  await document.fonts.ready;
  try {
    const pdf = new jspdf.jsPDF({unit: 'pt', format: 'letter', compress: true});
    const els = [...zona.querySelectorAll('.hoja')];
    for (let i = 0; i < els.length; i++) {
      if (!sigue()) return null;
      avance(i + 1, els.length);
      const c = await html2canvas(els[i], {scale: 2, backgroundColor: '#ffffff', logging: false, useCORS: true});
      if (i) pdf.addPage('letter');
      pdf.addImage(c.toDataURL('image/jpeg', .9), 'JPEG', 0, 0, 612, 612 * c.height / c.width);
    }
    return pdf.output('blob');
  } finally { zona.innerHTML = ''; zona.style.cssText = ''; }
}
// El PDF se prepara en cuanto se ve la vista previa (mostrarPdf → prepararPdf). Así, al tocar «Compartir» o «Guardar»,
// el menú del celular se abre en ese mismo toque: el iPhone (Safari y Bluefy) solo lo deja abrir justo después de tocar
// algo, y si antes había que esperar varios segundos preparando el PDF, lo bloqueaba. En iPhone fuera de Safari (Bluefy)
// las descargas no se pueden guardar: allí «Guardar» también abre el menú, donde está «Guardar en Archivos».
// S.pdf tiene tres formas: {cargando: texto} mientras se traen los datos del equipo · {error: texto} si no se pudo armar
// el documento · {hojas, titulo, nombre, quien, estado, avance, archivo, fallo, compartiendo} con la vista previa, donde
// estado = 'preparando' | 'listo' | 'fallo', avance = texto del botón mientras se prepara, archivo = el PDF listo,
// fallo = por qué no se pudo preparar, compartiendo = hora en que se abrió el menú (un segundo menú a la vez falla).
let colaPdf = Promise.resolve();
async function prepararPdf() {
  const D = S.pdf;
  if (!D || !D.hojas || D.estado === 'preparando' || D.estado === 'listo') return;
  Object.assign(D, {estado: 'preparando', avance: 'Preparando el PDF…'});
  if (pdfVigente(D)) pintar();         // también quita el aviso de un fallo anterior
  try {
    // de a uno: hacerPdf dibuja en una sola zona oculta (#imprimir); dos a la vez se mezclarían
    const turno = colaPdf.then(() => hacerPdf(D.hojas,
      (i, n) => { D.avance = `Preparando la hoja ${i} de ${n}…`; if (pdfVigente(D)) pintar(); },
      () => pdfVigente(D)));           // el usuario salió: no se sigue gastando el celular
    colaPdf = turno.catch(() => {});
    const blob = await turno;
    if (!blob) { D.estado = null; return; }   // cancelado (volver a abrir un documento siempre arma uno nuevo)
    D.archivo = new File([blob], D.nombre, {type: 'application/pdf'});
    D.estado = 'listo';
  } catch (e) {
    Object.assign(D, {estado: 'fallo', fallo: e.message || String(e)});
  }
  if (pdfVigente(D)) pintar();
}
function entregarPdf(compartir) {
  const D = S.pdf;
  if (!D || D.estado !== 'listo') return tostada('Un momento: el PDF todavía se está preparando.');
  // si el menú quedó abierto (o el celular nunca avisó que se cerró), a los 30 s se deja abrir otra vez
  if (D.compartiendo && Date.now() - D.compartiendo < 30000) return tostada('El menú para compartir ya está abierto.');
  const f = D.archivo;
  if ((compartir || esIphone()) && navigator.canShare && navigator.canShare({files: [f]})) {
    // sin esperas antes de esta línea: el menú se abre dentro del mismo toque
    D.compartiendo = Date.now();
    navigator.share({files: [f], title: D.nombre})
      .catch(e => {
        if (e && e.name !== 'AbortError' && e.name !== 'InvalidStateError')   // cerrar el menú no es un error
          tostada('No se pudo abrir el menú para compartir. <button class="anotar" data-act="abrirpdf">Abrir el PDF</button>', 8000, true);
      })
      .finally(() => { D.compartiendo = 0; });
    return;
  }
  if (esIphone()) return abrirPdfAparte(D);
  const url = URL.createObjectURL(f), a = document.createElement('a');
  a.href = url; a.download = D.nombre; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), PDF_URL_MS);
  tostada(compartir ? 'Este navegador no deja compartir: el PDF se guardó en Descargas.' : 'PDF guardado en Descargas.');
}
// Último recurso: el PDF en otra pestaña (desde ahí el botón de compartir del navegador lo guarda). Solo se llama dentro de
// un toque, y nunca reemplaza la página de la app: eso cortaría el Bluetooth y perdería lo que se estaba haciendo.
const PDF_URL_MS = 10 * 60 * 1000;   // cuánto vive el enlace al PDF abierto aparte (para guardarlo desde esa pestaña)
function abrirPdfAparte(D) {
  const url = URL.createObjectURL(D.archivo);
  setTimeout(() => URL.revokeObjectURL(url), PDF_URL_MS);
  if (window.open(url, '_blank')) tostada('Se abrió el PDF en otra pestaña: use el botón de compartir del navegador para guardarlo.', 7000);
  else tostada('Este navegador no deja abrir el PDF. Pruebe en Chrome (Android) o en Safari.', 7000, true);
}

// ---- animación de inicio (propuesta C · firma, elegida el 06/11/2026) --------------------------------------------------------
// Una pluma de luz traza la curva TK como una firma, la T y la K suben detrás y sale «TK_APP». Unos 4 s; tocar la pantalla
// la salta. Con «reducir movimiento» del celular solo aparece y se va.
// Suena «pi-pi-pi» (inicio.mp3, 06/11/2026): tres notas de marimba a los 1,42 · 1,66 · 1,95 s, cuando suben la T y la K.
// Los celulares no dejan sonar una página que nadie ha tocado (salvo la app instalada): si se bloquea, la intro sale en
// silencio y el pi-pi-pi suena una vez al conectar el equipo (sonidoParaDespues / sonarAlConectar, más abajo).
// Sincronía: el sonido se carga y decodifica primero (Web Audio), se espera a que la intro esté pintada y entonces arrancan
// juntos sonido, animaciones CSS y la pluma (SMIL) en el mismo cuadro. Si el sonido no llega en 0,8 s, arranca sin él.
const MARCA_T = '246.71 639.26 246.71 143.38 50.36 143.38 50.36 0 622.95 0 622.95 143.38 427.52 143.38 427.52 639.26 246.71 639.26';
const MARCA_K = '908.96 695.6 634.65 339.57 894.35 56.34 696.18 56.34 421.3 351.31 421.3 564.81 515.83 463.52 698.92 695.6 908.96 695.6';
const MARCA_FIRMA = 'M214,346 C120,392 64,458 64,530 C64,660 240,766 463,766 C560,766 645,746 712,711';   // la curva TK como un trazo
const ADELANTO_SONIDO = .2;                       // s que el sonido va antes que la animación (sube si aún se oye tarde)
const NOTAS_INICIO_S = 1.42;                      // en inicio.mp3 la primera nota suena a los 1,42 s (antes, silencio)
const MARGEN_NOTA_S = .1;                         // se arranca un poco antes para no cortar el golpe de la primera nota
// El sonido de inicio por su ganancia hacia el parlante; devuelve la fuente (para arrancarla) y el volumen (para apagarlo)
function sonidoInicio(ctx, buf) {
  const fuente = ctx.createBufferSource(), volumen = ctx.createGain();
  volumen.gain.value = .8; fuente.buffer = buf; fuente.connect(volumen).connect(ctx.destination);
  return {fuente, volumen};
}
function inicioAnimado() {
  const quieto = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const el = document.createElement('div');
  el.className = 'inicio-tk' + (quieto ? ' quieto' : '');
  el.innerHTML = `<div class="it-centro"><svg class="it-marca" viewBox="0 -20 930 760"><defs>
    <linearGradient id="itTrazo" x1="0" x2="1"><stop offset="0" stop-color="#9CC0F5"/><stop offset="1" stop-color="#5BE0FF"/></linearGradient>
    <filter id="itLuz" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter></defs>
    <g class="it-letras"><polygon fill="#fff" points="${MARCA_T}"/><g transform="translate(-17.54 -56.34)"><polygon fill="#fff" points="${MARCA_K}"/></g></g>
    <g transform="translate(-17.54 -56.34)"><path class="it-trazo" d="${MARCA_FIRMA}" fill="none" stroke="url(#itTrazo)" stroke-width="34" stroke-linecap="round"/>
    ${quieto ? '' : `<g opacity="0"><circle r="26" fill="#5BE0FF" filter="url(#itLuz)"/><circle r="11" fill="#fff"/>
      <animateMotion begin="indefinite" dur="1.1s" fill="freeze" path="${MARCA_FIRMA}" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines=".55 .05 .35 1"/>
      <animate attributeName="opacity" begin="indefinite" dur="1.2s" fill="freeze" values="1;1;0" keyTimes="0;.85;1"/></g>`}</g></svg>
    <div class="it-nombre"><b>TK_APP</b><span>INGENIERÍA PARA LA ESTÉTICA</span></div></div>`;
  document.body.appendChild(el);
  let fin = false, arrancada = false, ctx = null, volumen = null;
  const cerrar = () => {
    if (fin) return;
    fin = true; el.classList.add('sale'); setTimeout(() => el.remove(), 450);
    if (volumen) { volumen.gain.setTargetAtTime(0, ctx.currentTime, .08); setTimeout(() => ctx.close().catch(() => {}), 600); }
  };
  el.addEventListener('pointerdown', cerrar);
  // el próximo cuadro pintado (con respaldo: si la pantalla no pinta, a los 60 ms igual sigue)
  const cuadro = f => { let hecho = false; const g = () => { if (!hecho) { hecho = true; f(); } }; requestAnimationFrame(g); setTimeout(g, 60); };
  // arranca todo en el mismo cuadro: la clase «va» suelta las animaciones CSS y la pluma empieza 0,3 s después
  const arrancar = fuente => {
    if (arrancada || fin) return;
    arrancada = true;
    cuadro(() => {
      // El celular tarda en sacar el audio por el parlante: el sonido arranca primero y la animación espera ese retraso
      // (el que reporta el navegador, nunca menos de ADELANTO_SONIDO) para que el golpe caiga justo con la marca.
      let espera = 0;
      if (fuente) {
        fuente.start();
        espera = Math.max(ADELANTO_SONIDO, (ctx.outputLatency || 0) + (ctx.baseLatency || 0)) * 1000;
      }
      setTimeout(() => {
        el.classList.add('va');
        el.querySelectorAll('animateMotion, animate').forEach(a => { try { a.beginElementAt(.3); } catch (_) { /* sin SMIL */ } });
        setTimeout(cerrar, quieto ? 900 : 3500);    // la animación acaba a los 2,5 s y queda 1 s más a la vista
      }, espera);
    });
  };
  setTimeout(() => arrancar(null), 800);            // el sonido no llegó: la intro no espera más
  const Contexto = window.AudioContext || window.webkitAudioContext;
  if (!Contexto) return arrancar(null);
  (async () => {
    try {
      ctx = new Contexto();
      const datos = await (await fetch(SONIDO_DEMO)).arrayBuffer();
      const buf = await new Promise((ok, mal) => ctx.decodeAudioData(datos, ok, mal));
      if (ctx.state !== 'running') await Promise.race([ctx.resume(), new Promise(r => setTimeout(r, 250))]);
      if (ctx.state !== 'running') { sonidoParaDespues(ctx, buf); return arrancar(null); }   // no deja sonar: suena al conectar
      let fuente;
      ({fuente, volumen} = sonidoInicio(ctx, buf));
      cuadro(() => arrancar(fuente));                        // un cuadro más: la intro ya está pintada
    } catch (_) { arrancar(null); }
  })();
}
// El navegador no dejó sonar la intro (pasa siempre en iPhone, a veces en Android). El sonido queda listo; el primer toque que de verdad lo
// desbloquea quita los oyentes, y el pi-pi-pi suena una vez cuando se conecta el equipo. Al terminar se apaga el audio.
let sonidoPendiente = null;
function sonidoParaDespues(ctx, buf) {
  sonidoPendiente = {ctx, buf, sonado: false};
  const desbloquear = () => {
    ctx.resume().then(() => {
      if (ctx.state === 'running') for (const t of ['touchend', 'click']) document.removeEventListener(t, desbloquear, true);
    }).catch(() => {});
  };
  for (const t of ['touchend', 'click']) document.addEventListener(t, desbloquear, true);
}
function sonarAlConectar() {
  const s = sonidoPendiente;
  if (!s || s.sonado) return;
  s.ctx.resume().then(() => {
    if (s.ctx.state !== 'running' || s.sonado) return;
    s.sonado = true;
    const {fuente} = sonidoInicio(s.ctx, s.buf);
    fuente.onended = () => s.ctx.close().catch(() => {});
    fuente.start(0, NOTAS_INICIO_S - MARGEN_NOTA_S);   // sin el silencio del principio (en la intro acompaña a la animación)
  }).catch(() => {});
}

// Modo noche de 6 p. m. a 6 a. m. con la hora del celular; de día, modo día. Se revisa cada minuto.
function temaPorHora() {
  const h = new Date().getHours(), noche = h >= 18 || h < 6;
  document.documentElement.classList.toggle('noche', noche);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = noche ? '#100F26' : '#22204F';

// Zonas que, al repintar la misma pantalla, quedan donde el usuario las dejó
const DESPLAZABLES = ['.cuerpo', '.mini-pdf', '.atajo-panel'];
function pintar() {

  if (foco) { const n = foco === 'buscar' ? cel.querySelector('[data-buscar]') : cel.querySelector(`[data-cons="${foco}"]`); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (_) { /* tipo sin cursor */ } } }

// ---- toques -----------------------------------------------------------------------------------------------------------------
function ir(p) {
  if (!S.con && !['conectar', 'clave'].includes(p)) p = 'conectar';
  if (p === 'conectar' && S.con) return;
  if (p === 'firma' && S.firmado && !S.pend) S.firmado = null;
  S.prev = S.p; S.p = p;
  if (p === 'usuarios') { S.usuarios = null; cargarUsuarios(); }
  if (p === 'ajustes' && !S.consLeido) leerConsultorio().then(() => { if (S.p === 'ajustes') pintar(); });
  pintar();
}
function accion(a) {
  if (a === 'buscar') buscarEquipo();
  else if (a === 'atras') {
    if (S.p === 'clave') { perderConexion(); return; }
    S.p = S.p === 'pdf' ? (S.prev === 'firma' ? 'firma' : 'ficha') : S.p === 'ficha' ? 'usuarios' : S.p === 'logo' ? 'ajustes' : 'inicio';
    if (S.p === 'ficha' && !S.ficha) S.p = 'usuarios';
    pintar();
  }
  else if (a === 'bluefy') abrirEnBluefy();
  else if (a === 'atajo') { S.atajo = true; prepararIcono(); pintar(); }
  else if (a === 'atajocerrar') { S.atajo = false; pintar(); }
  else if (a === 'agregaratajo') location.href = enSafari(ATAJO_ICLOUD);
  else if (a === 'guardaricono') guardarIcono();
  else if (a === 'copiar') {
    (navigator.clipboard ? navigator.clipboard.writeText(DIR_APP) : Promise.reject()).then(() => tostada('Dirección copiada. Ábrala en Bluefy y péguela arriba.'))
      .catch(() => tostada('Copie a mano esta dirección: ' + esc(DIR_APP), 8000, true));
  }
  else if (a === 'documentos') { window.open(URL_DOCUMENTOS, '_blank', 'noopener'); }
  else if (a === 'paso') { if (S.firmaPaso === 1 && !(S.checks[0] && S.checks[1])) return; S.firmaPaso++; pintar(); }
  else if (a === 'abrirfirma') { S.trazosTmp = []; S.lienzoTotal = true; pintar(); }
  else if (a === 'ftborrar') { S.trazosTmp = []; pintar(); }
  else if (a === 'ftcancelar') { S.lienzoTotal = false; pintar(); }
  else if (a === 'ftlisto') { if (!firmaSuficiente()) return; S.trazos = S.trazosTmp; S.trazosTmp = []; S.lienzoTotal = false; encajarFirma(); S.firmaPaso = 3; pintar(); }
  else if (a === 'zmas' || a === 'zmenos') { if (S._zoomEn) S._zoomEn(a === 'zmas' ? 1.2 : 1 / 1.2); }
  else if (a === 'centrar') { encajarFirma(); pintar(); }
  else if (a === 'enviar') enviarFirma();
  else if (a === 'pdfci') abrirPdf('ci', 0, S.firmado.id);
  else if (a === 'pdfleer') abrirLectura();
  else if (a === 'compartir') entregarPdf(true);
  else if (a === 'guardar') entregarPdf(false);
  else if (a === 'reintentarpdf') { if (S.pdf && S.pdf.estado === 'fallo') prepararPdf(); }
  else if (a === 'abrirpdf') { if (S.p === 'pdf' && S.pdf && S.pdf.estado === 'listo') abrirPdfAparte(S.pdf); }
  else if (a === 'otrafoto') elegirFoto();
  else if (a === 'usarlogo') usarLogo();
  else if (a === 'guardarcons') guardarConsultorio();
  else if (a === 'olvidar') olvidarEquipo();
  else if (a === 'desconectar') perderConexion('Desconectado. El equipo queda libre para otro celular.');
}
// «Leer el documento completo» antes de firmar: el CI con los datos del que va a firmar, sin firma todavía
function abrirLectura() {
  S.prev = 'firma'; S.p = 'pdf';
  const base = {u: {id: 0, nombre: S.nuevo.nombre, cc: S.nuevo.cc}, cons: S.cons, logo: S.logo, modelo: S.modelo};
  const a = ahora();
  mostrarPdf({hojas: paginar(docCI({...base, ci: {fecha: `${a.f} · ${a.h}`, consultorio: S.cons.nombre}, firma: ''}), base), titulo: 'Autorización (para leer)', nombre: 'Autorizacion.pdf', quien: S.nuevo.nombre});

async function olvidarEquipo() {
