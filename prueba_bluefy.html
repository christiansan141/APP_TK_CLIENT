<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba Bluefy</title>
<style>
  body { font: 500 16px/1.45 -apple-system, "Segoe UI", sans-serif; color: #29265B; background: #F3F4FB; margin: 0; padding: 20px }
  h1 { font-size: 21px; margin: 0 0 6px } p { color: #5D5B86; margin: 0 0 16px }
  a { display: block; margin: 10px 0; padding: 14px 16px; border-radius: 14px; background: #2E2B7A; color: #fff; text-decoration: none; font-weight: 600 }
  a span { display: block; font: 12px/1.3 ui-monospace, monospace; opacity: .75; margin-top: 4px; word-break: break-all }
</style>
</head>
<body>
<h1>¿Cuál abre Bluefy?</h1>
<p>Con Bluefy instalado, abre esta página en Safari y toca los botones uno por uno. Anota el número del que abra Bluefy
directamente en TK_APP (si el iPhone pregunta «¿Abrir en Bluefy?», acepta).</p>
<div id="lista"></div>
<script>
const app = 'https://christiansan141.github.io/APP_TK_CLIENT/';
const sin = app.replace(/^https:\/\//, '');
const formas = [
  'bluefy://open?url=' + encodeURIComponent(app),
  'bluefy://' + sin,
  'bluefys://' + sin,
  'bluefy://' + app,
  'bluefy:' + app,
];
document.getElementById('lista').innerHTML = formas.map((f, i) => `<a href="${f}">${i + 1}. Probar<span>${f}</span></a>`).join('');
</script>
</body>
</html>
